name: MGL safe local-fixture validation
# Prepared only. No workflow runs automatically on publication or PR creation.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}/mgl-fixtures
      MGLCONNECT_POSTGRES_TEST_CONNECTION: ''
      MGLCONNECT_SQLSERVER_TEST_CONNECTION: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.403'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Private disposable fixture directory
        run: mkdir -m 700 -p "$TMPDIR"
      - run: dotnet restore MglConnect.sln
      - run: dotnet build MglConnect.sln --no-restore -c Debug
      - run: dotnet test MglConnect.sln --no-build --no-restore -c Debug
      - run: node --test src/MglConnect.Tests/JavaScript/*.test.cjs
      - run: git diff --check
